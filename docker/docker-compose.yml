services:
  app:
    build:
      context: ./../
      dockerfile: ./docker/php-fpm/Dockerfile
      args:
        - PUID=1000
        - PGID=1000
    volumes:
      - ./../:/var/www/
    depends_on:
      - horizon
  horizon:
    build:
      context: ./../
      dockerfile: ./docker/php-fpm/Dockerfile
      args:
        - PUID=1000
        - PGID=1000
    working_dir: /var/www
    volumes:
      - ./../:/var/www/
    depends_on:
      - db
      - redis
    command: php artisan horizon
    restart: unless-stopped
  nginx:
    build:
      context: ./nginx
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ..:/var/www:rw
    depends_on:
      - app
  db:
    build:
      context: ./mysql
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DB}
    ports:
      - ${DB_PORT}:3306
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
volumes:
  db_data:
